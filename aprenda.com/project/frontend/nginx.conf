server {
    listen 80;
    server_name localhost;

    # Importante para que CSS e JS carreguem corretamente
    include /etc/nginx/mime.types;

    # Onde seus arquivos HTML estão no container
    root /usr/share/nginx/html/app/html;
    index index.html;

    # 1. Entrega dos arquivos estáticos (index.html, tarefa.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy reverso para o Backend (FastAPI)
    # Qualquer chamada que comece com /dash ou /tarefas vai para a API
    location ~ ^/(dash|tarefas) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}