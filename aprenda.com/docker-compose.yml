version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # Garante que o container esteja "saudável" apenas quando o banco responder
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: 
      context: ./project/backend
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/aprenda_db
    # O app só sobe quando o healthcheck do mongodb passar
    depends_on:
      mongodb:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    volumes:
    - ./project/frontend/app:/usr/share/nginx/html
    - ./project/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
    - "80:80"
    depends_on:
    - api

volumes:
  mongo_data: